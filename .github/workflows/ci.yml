name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Isolated test binary paths
        run: |
          echo "COE_TEST_PROBE=$RUNNER_TEMP/coe-build/bin/coe-probe" >> "$GITHUB_ENV"
          echo "COE_TEST_BINARY=$RUNNER_TEMP/coe-build/bin/coe" >> "$GITHUB_ENV"
      - name: Python / D-Bus test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv python3-dbus python3-gi dbus jq
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r requirements.txt
      - name: Build pinned Coe and protocol probe without installing
        run: python3 -B scripts/build_backend.py --output-dir "$RUNNER_TEMP/coe-build"
      - name: Python unit and localhost protocol tests
        run: |
          "$RUNNER_TEMP/venv/bin/python" -B -m unittest discover -s tests -v
      - name: Go tests and race detector
        working-directory: ${{ runner.temp }}/coe-build/core
        run: |
          go test ./...
          go test -race ./...
      - name: Isolated D-Bus / synthetic recording / mock ASR
        run: |
          dbus-run-session -- "$RUNNER_TEMP/venv/bin/python" -B tests/bootstrap_e2e.py
          dbus-run-session -- "$RUNNER_TEMP/venv/bin/python" -B tests/hold_e2e.py
      - name: Check out official Omarchy validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: omacom/omarchy
          ref: c668141e9c42b13c80c9ca4ea108e11708c5e8a5 # v4.0.4
          path: .ci-omarchy
      - name: Official plugin manifest validation
        run: |
          mv .ci-omarchy "$RUNNER_TEMP/omarchy-validator"
          bash "$RUNNER_TEMP/omarchy-validator/bin/omarchy-plugin-validate" .
